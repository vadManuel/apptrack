[project]
name = "applications"
version = "0.1.0"
description = ""
authors = [
    {name = "Manuel Vasquez Dickson",email = "vadmanuel@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pyyaml>=6.0"]

[tool.poetry]
package-mode = false 


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.8,<0.16.0)"
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
