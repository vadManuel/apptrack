[project]
name = "applications"
version = "0.1.0"
description = "CLI tool that visualizes job application timelines in the terminal"
authors = [
    {name = "Manuel Vasquez Dickson",email = "vadmanuel@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = ["cli", "job-applications", "gantt", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities",
]
dependencies = ["pyyaml>=6.0,<7.0"]

[project.scripts]
apptrack = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "ruff>=0.15.8,<0.16.0",
    "pyright>=1.1.408,<2.0.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
